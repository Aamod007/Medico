name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Build, Lint & Automated Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: medico_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Push Database Schema for Testing
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/medico_db?schema=public

      - name: Run API Security & Concurrency Tests
        run: npm run test:api
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/medico_db?schema=public
          JWT_ACCESS_SECRET: "super-secure-jwt-access-secret-min-32-chars-for-medico"
          RAZORPAY_WEBHOOK_SECRET: "test_webhook_secret_key_123"

      - name: Build Packages & Apps
        run: npm run build
