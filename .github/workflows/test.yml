name: Complete Test & QA Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Typecheck, Lint, API & E2E Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Core Unit Tests
        run: node scripts/unit-tests.js

      - name: Run Phase 3 API & Concurrency Tests
        run: npx vitest run tests/api/
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: "super-secure-jwt-access-secret-min-32-chars-for-medico"
          RAZORPAY_WEBHOOK_SECRET: "YourWebhookSecretHere"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Accessibility & Core E2E Tests
        run: npx playwright test tests/a11y/ tests/e2e/j1-guest-browsing.spec.ts --project=chromium
        env:
          FRONTEND_URL: "http://localhost:3000"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: test-artifacts/
          retention-days: 14
